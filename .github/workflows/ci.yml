name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keyless by design: CI never needs an API key or any repository secret.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # A healthy run takes about 4 minutes; fail fast if something hangs.
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: arunika
          POSTGRES_USER: postgres
          # Throwaway password for a disposable CI container, not a real secret.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arunika"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: arunika
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-password
      # Throwaway values for the disposable CI database, not real secrets.
      NLQ_READER_PASSWORD: ci-only-reader-password
      RLS_SIGNING_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      APP_WRITER_PASSWORD: ci-only-writer-password
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      DEMO_ANALYST_PASSWORD: ci-only-analyst
      DEMO_MANAGER_PASSWORD: ci-only-manager
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Database ping
        run: uv run poe db-ping
      - name: Build schemas and load the seed
        run: uv run poe db-load
      # The local embedding model (~220 MB, Apache-2.0) downloads once, then comes from the cache.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('.env.example') }}
      - name: Build the retrieval index (pgvector, local embeddings)
        run: uv run poe index-build
      - name: Set up the API schema, write-only role, and demo users
        run: uv run poe app-setup
      - name: Check (lint, format, workflow schema, tests incl. keyless agent and API end to end)
        run: uv run poe check
      - name: Eval sanity check (gold vs gold, keyless, must be 100%)
        run: uv run poe eval --system gold --split dev,test
      - name: Eval plumbing check (keyless baseline; not a quality measure)
        run: uv run poe eval --system baseline --mode keyless --split dev
      - name: Eval plumbing check (keyless agent; safety and grounding gates must pass)
        run: uv run poe eval --system agent --mode keyless --split dev
      # Browser smoke test: sign in, ask a keyless demo question, see steps, SQL, table, answer.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web app and Chromium
        run: |
          npm --prefix web ci
          npx --prefix web playwright install --with-deps chromium
      - name: Smoke test (Playwright, keyless)
        run: npm --prefix web run e2e
        timeout-minutes: 10

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint, format check, typecheck, unit tests, build
        run: npm run check

  # The production stack (infra/), built and run keyless with a throwaway env file.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Set in a step: the runner context isn't available in a job's env block.
      - name: Throwaway keyless env file (random values, plain HTTP)
        run: |
          echo "ENV_FILE=$RUNNER_TEMP/prod.env" >> "$GITHUB_ENV"
          ENV_FILE="$RUNNER_TEMP/prod.env" infra/make-env.sh :80 --keyless
      - name: Build the images
        run: infra/compose.sh build
      - name: Seed (schemas, data, retrieval index, demo users)
        run: infra/compose.sh run --rm seed
      - name: Start the stack
        run: infra/compose.sh up -d --wait
      - name: Smoke test through Caddy (keyless)
        run: python3 infra/smoke_public.py --url http://127.0.0.1 --ask
      - name: Logs
        if: failure()
        run: infra/compose.sh logs --tail 100
      - name: Stop
        if: always()
        run: infra/compose.sh down -v
