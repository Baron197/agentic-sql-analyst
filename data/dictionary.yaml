  - {from: fact_support_tickets.customer_id, to: dim_customer.customer_id}
  - {from: fact_support_tickets.order_id, to: fact_orders.order_id}
  - {from: fact_support_tickets.assigned_employee_id, to: dim_employee.employee_id}
  - {from: fact_sales_targets.store_id, to: dim_store.store_id}
  - {from: fact_store_daily_traffic.store_id, to: dim_store.store_id}
  - {from: fact_store_daily_traffic.traffic_date, to: dim_date.date_key}

glossary:
  - name: gross_sales
    label: {en: Gross sales, id: Penjualan kotor}
    synonyms:
      en: [gross sales, gross revenue, GMV]
      id: [penjualan kotor, omzet kotor, GMV]
    description: Value of order lines at selling price before discounts and refunds, excluding cancelled orders.
    sql: |
      SELECT SUM(oi.quantity * oi.unit_price_idr) AS gross_sales_idr
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'

  - name: net_revenue
    label: {en: Net revenue, id: Pendapatan bersih}
    synonyms:
      en: [net revenue, revenue, net sales, sales, turnover]
      id: [pendapatan bersih, pendapatan, omzet, omset, penjualan, penjualan bersih]
    description: >-
      Line value after line discounts, minus refunds, excluding cancelled orders.
      Refunds are attributed to the order's date (not the return date). Shipping fees
      are not revenue. "Revenue" or "sales" without qualification means net revenue.
    sql: |
      WITH order_net AS (
        SELECT o.order_id,
               SUM(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
        FROM analytics.fact_orders o
        JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
        WHERE o.status <> 'cancelled'
        GROUP BY o.order_id
      ),
      refunds AS (
        SELECT order_id, SUM(refund_amount_idr) AS refunded
        FROM analytics.fact_returns
        GROUP BY order_id
      )
      SELECT SUM(n.line_net - COALESCE(r.refunded, 0)) AS net_revenue_idr
      FROM order_net n
      LEFT JOIN refunds r ON r.order_id = n.order_id

  - name: aov
    label: {en: Average order value (AOV), id: Rata-rata nilai pesanan}
    synonyms:
      en: [AOV, average order value, average basket, basket size]
      id: [AOV, rata-rata nilai pesanan, rata-rata belanja, nilai keranjang rata-rata]
    description: Average order value after line discounts (before refunds) over orders that were not cancelled.
    sql: |
      SELECT ROUND(SUM(o.total_amount)::numeric / COUNT(*)) AS aov_idr
      FROM analytics.fact_orders o
      WHERE o.status <> 'cancelled'

  - name: return_rate
    label: {en: Return rate, id: Tingkat retur}
    synonyms:
      en: [return rate, returns rate]
      id: [tingkat retur, rasio retur, persentase retur]
    description: Returned units divided by sold units, over orders that were not cancelled. A ratio between 0 and 1.
    sql: |
      SELECT ROUND(
        (SELECT SUM(r.quantity)
         FROM analytics.fact_returns r
         JOIN analytics.fact_orders o ON o.order_id = r.order_id
         WHERE o.status <> 'cancelled')::numeric
        /
        (SELECT SUM(oi.quantity)
         FROM analytics.fact_order_items oi
         JOIN analytics.fact_orders o ON o.order_id = oi.order_id
         WHERE o.status <> 'cancelled'),
        4) AS return_rate

  - name: active_customers
    label: {en: Active customers, id: Pelanggan aktif}
    synonyms:
      en: [active customers, active members, active buyers]
      id: [pelanggan aktif, member aktif, pembeli aktif]
    description: >-
      Registered customers with at least one completed order in the 90 days up to and
      including the as-of date (WIB). Default as-of date = the last order date in the data.
    sql: |
      WITH as_of AS (
        SELECT MAX((ordered_at AT TIME ZONE 'Asia/Jakarta')::date) AS d
        FROM analytics.fact_orders
      )
      SELECT COUNT(DISTINCT o.customer_id) AS active_customers
      FROM analytics.fact_orders o
      CROSS JOIN as_of
      WHERE o.status = 'completed'
        AND o.customer_id IS NOT NULL
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date > as_of.d - 90
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date <= as_of.d

  - name: conversion_rate
    label: {en: Conversion rate, id: Tingkat konversi}
    synonyms:
      en: [conversion rate, CVR, session conversion]
      id: [tingkat konversi, rasio konversi, konversi]
    description: >-
      Share of website and app sessions that placed an order (converted sessions / all
      sessions). A ratio between 0 and 1. Marketplace and in-store orders are not included.
    sql: |
      SELECT ROUND(AVG(s.converted::int), 4) AS conversion_rate
      FROM analytics.fact_web_sessions s
