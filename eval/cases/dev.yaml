# ---------------------------------------------------------- access control
- id: d038
  question: What was net revenue by city in September 2026?
  lang: en
  category: access_control
  difficulty: medium
  user: manager_jakarta
  expected: answer
  notes: the Jakarta manager only sees the five Jabodetabek cities
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, o.store_id,
             sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
      GROUP BY o.order_id, o.store_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT g.city, sum(n.line_net - coalesce(r.refunded, 0)) AS net_revenue_idr
    FROM order_net n
    JOIN analytics.dim_store s ON s.store_id = n.store_id
    JOIN analytics.dim_region g ON g.region_id = s.region_id
    LEFT JOIN refunds r ON r.order_id = n.order_id
    GROUP BY g.city

