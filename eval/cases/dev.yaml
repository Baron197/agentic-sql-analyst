    SELECT segment, count(*) AS customers FROM analytics.dim_customer GROUP BY segment

- id: d009
  question: How many units have been returned because they arrived damaged?
  lang: en
  category: aggregation
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT sum(quantity) AS units_returned FROM analytics.fact_returns WHERE reason = 'damaged'

# -------------------------------------------------------------------- join
- id: d010
  question: Which 5 brands sold the most units in 2025, excluding cancelled orders?
  lang: en
  category: join
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT p.brand
    FROM analytics.fact_orders o
    JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
    JOIN analytics.dim_product p ON p.product_id = oi.product_id
    WHERE o.status <> 'cancelled'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY p.brand
    ORDER BY sum(oi.quantity) DESC
    LIMIT 5

- id: d011
  question: Toko mana yang memiliki jumlah pengunjung terbanyak pada bulan Agustus 2026?
  lang: id
  category: join
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT s.store_name
    FROM analytics.fact_store_daily_traffic t
    JOIN analytics.dim_store s ON s.store_id = t.store_id
    WHERE t.traffic_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31'
    GROUP BY s.store_name
    ORDER BY sum(t.visitors) DESC
    LIMIT 1

- id: d012
  question: Which supplier has the most purchase orders that arrived later than the expected date?
  lang: en
  category: join
  difficulty: hard
  expected: answer
  gold_sql: |
    SELECT sup.supplier_name
    FROM analytics.fact_purchase_orders po
    JOIN analytics.dim_supplier sup ON sup.supplier_id = po.supplier_id
    WHERE po.received_date > po.expected_date
    GROUP BY sup.supplier_name
    ORDER BY count(*) DESC
    LIMIT 1

- id: d013
  question: How many parcels did each courier deliver in September 2026?
  lang: en
  category: join
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT courier, count(*) AS parcels_delivered
    FROM analytics.fact_shipments
    WHERE shipment_status = 'delivered'
      AND (delivered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
    GROUP BY courier

- id: d014
  question: For website and app sessions in 2025, what was the conversion rate of each traffic source?
  lang: en
  category: metric_definition
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT traffic_source, round(avg(converted::int), 4) AS conversion_rate
    FROM analytics.fact_web_sessions
    WHERE (started_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY traffic_source

- id: d015
  question: Kategori utama (level 1) mana yang paling banyak unit returnya selama 2025?
  lang: id
  category: join
  difficulty: hard
  expected: answer
  notes: returns processed in 2025 (returned_at), grouped by the product's top-level category
  gold_sql: |
    SELECT top.category_name
    FROM analytics.fact_returns r
    JOIN analytics.fact_order_items oi ON oi.order_item_id = r.order_item_id
    JOIN analytics.dim_product p ON p.product_id = oi.product_id
    JOIN analytics.dim_category c ON c.category_id = p.category_id
    JOIN analytics.dim_category top ON top.category_id = c.parent_category_id
    WHERE (r.returned_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY top.category_name
    ORDER BY sum(r.quantity) DESC
    LIMIT 1

# -------------------------------------------------------------------- time
- id: d016
  question: How many orders were placed on Harbolnas, 11 November 2025?
  lang: en
  category: time
  difficulty: medium
  expected: answer
  notes: WIB date; grouping by UTC date moves the midnight rush to 10 November
  gold_sql: |
    SELECT count(*) AS orders
    FROM analytics.fact_orders
    WHERE (ordered_at AT TIME ZONE 'Asia/Jakarta')::date = DATE '2025-11-11'

- id: d017
  question: What was our net revenue last month?
  lang: en
  category: time
  difficulty: medium
  expected: answer
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date AS order_date,
             sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
      GROUP BY o.order_id, o.ordered_at
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT sum(n.line_net - coalesce(r.refunded, 0)) AS net_revenue_idr
    FROM order_net n
    LEFT JOIN refunds r ON r.order_id = n.order_id
    WHERE n.order_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'

- id: d018
  question: Berapa rata-rata jumlah pesanan per hari selama bulan Ramadan 2025?
  lang: id
  category: time
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT round(count(o.order_id)::numeric / count(DISTINCT d.date_key), 2) AS orders_per_day
    FROM analytics.dim_date d
    LEFT JOIN analytics.fact_orders o
      ON (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date = d.date_key
    WHERE d.is_ramadan AND d.year = 2025

- id: d019
  question: In calendar Q2 2026, how many orders were placed on weekends and how many on weekdays?
  lang: en
  category: time
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT d.is_weekend, count(*) AS orders
    FROM analytics.fact_orders o
    JOIN analytics.dim_date d ON d.date_key = (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date
    WHERE d.year = 2026 AND d.quarter = 2
    GROUP BY d.is_weekend

- id: d020
  question: How many completed orders were there in the busiest month of 2025?
  lang: en
  category: time
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT max(n) AS completed_orders
    FROM (
      SELECT date_trunc('month', o.ordered_at AT TIME ZONE 'Asia/Jakarta') AS m, count(*) AS n
      FROM analytics.fact_orders o
      WHERE o.status = 'completed'
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
      GROUP BY 1
    ) monthly

- id: d021
  question: Berapa pendapatan bersih pada kuartal fiskal pertama FY2026?
  lang: id
  category: time
  difficulty: hard
  expected: answer
  notes: FY2026 Q1 = April-June 2026
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date AS order_date,
             sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
      GROUP BY o.order_id, o.ordered_at
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT sum(n.line_net - coalesce(r.refunded, 0)) AS net_revenue_idr
    FROM order_net n
    JOIN analytics.dim_date d ON d.date_key = n.order_date
    LEFT JOIN refunds r ON r.order_id = n.order_id
    WHERE d.fiscal_year = 2026 AND d.fiscal_quarter = 1

# ------------------------------------------------------- metric definition
- id: d022
  question: What was the average order value in 2025?
  lang: en
  category: metric_definition
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT round(sum(total_amount)::numeric / count(*)) AS aov_idr
    FROM analytics.fact_orders
    WHERE status <> 'cancelled'
      AND (ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'

- id: d023
  question: Berapa return rate untuk kategori Fashion untuk pesanan sepanjang 2025?
  lang: id
  category: metric_definition
  difficulty: hard
  expected: answer
  gold_sql: |
    SELECT round(sum(coalesce(r.qty, 0))::numeric / sum(oi.quantity), 4) AS return_rate
    FROM analytics.fact_orders o
    JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
    JOIN analytics.dim_product p ON p.product_id = oi.product_id
    JOIN analytics.dim_category c ON c.category_id = p.category_id
    JOIN analytics.dim_category top ON top.category_id = c.parent_category_id
    LEFT JOIN (
      SELECT order_item_id, sum(quantity) AS qty FROM analytics.fact_returns GROUP BY order_item_id
    ) r ON r.order_item_id = oi.order_item_id
    WHERE o.status <> 'cancelled'
      AND top.category_name = 'Fashion'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'

- id: d024
  question: How many active customers do we have as of the end of the data?
  lang: en
  category: metric_definition
  difficulty: medium
  notes: active = at least one completed order in the 90 days up to and including 2026-09-30
  expected: answer
  gold_sql: |
    SELECT count(DISTINCT customer_id) AS active_customers
    FROM analytics.fact_orders
    WHERE status = 'completed' AND customer_id IS NOT NULL
      AND (ordered_at AT TIME ZONE 'Asia/Jakarta')::date > DATE '2026-09-30' - 90
      AND (ordered_at AT TIME ZONE 'Asia/Jakarta')::date <= DATE '2026-09-30'

- id: d025
  question: What was the conversion rate of website sessions in September 2026?
  lang: en
  category: metric_definition
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT round(avg(s.converted::int), 4) AS conversion_rate
    FROM analytics.fact_web_sessions s
    JOIN analytics.dim_channel c ON c.channel_id = s.channel_id
    WHERE c.channel_code = 'website'
      AND (s.started_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'

- id: d026
  question: What were gross sales and net revenue in FY2025?
  lang: en
  category: metric_definition
  difficulty: hard
  notes: FY2025 = 1 April 2025 to 31 March 2026
  expected: answer
  gold_sql: |
    WITH lines AS (
      SELECT o.order_id,
             sum(oi.quantity * oi.unit_price_idr) AS gross,
             sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-04-01' AND DATE '2026-03-31'
      GROUP BY o.order_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT sum(l.gross) AS gross_sales_idr,
           sum(l.line_net - coalesce(r.refunded, 0)) AS net_revenue_idr
    FROM lines l
    LEFT JOIN refunds r ON r.order_id = l.order_id

- id: d027
  question: Berapa omzet per channel penjualan di tahun 2025?
  lang: id
  category: metric_definition
  difficulty: medium
  notes: omzet without qualification = net revenue
  expected: answer
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, o.channel_id,
             sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
      GROUP BY o.order_id, o.channel_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT c.channel_code, sum(n.line_net - coalesce(r.refunded, 0)) AS net_revenue_idr
    FROM order_net n
    JOIN analytics.dim_channel c ON c.channel_id = n.channel_id
    LEFT JOIN refunds r ON r.order_id = n.order_id
    GROUP BY c.channel_code

# --------------------------------------------------------------- ambiguous
- id: d028
  question: Who are our best customers?
  lang: en
  category: ambiguous
  difficulty: medium
  expected: state_assumption
  notes: default assumption = top 10 customers by net revenue over all available data
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, o.customer_id,
             sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled' AND o.customer_id IS NOT NULL
      GROUP BY o.order_id, o.customer_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT n.customer_id
    FROM order_net n
    LEFT JOIN refunds r ON r.order_id = n.order_id
    GROUP BY n.customer_id
    ORDER BY sum(n.line_net - coalesce(r.refunded, 0)) DESC
    LIMIT 10

