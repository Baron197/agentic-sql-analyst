# Dev split: used for tuning and failure analysis. Never quote these numbers as results.
# Conventions for gold SQL (see data/dictionary.yaml business rules and glossary):
# - business dates are WIB: (ordered_at AT TIME ZONE 'Asia/Jakarta')::date
# - revenue excludes cancelled orders; net revenue subtracts refunds, attributed to the order date
# - "today" is 2026-10-01 (eval/cases.py AS_OF_DATE): "last month" = September 2026
# - gold selects only the values the question asks for; averages and ratios are rounded

# ------------------------------------------------------------------ lookup
- id: d001
  question: How many stores does the company have in Surabaya?
  lang: en
  category: lookup
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT count(*) AS stores
    FROM analytics.dim_store s
    JOIN analytics.dim_region r ON r.region_id = s.region_id
    WHERE r.city = 'Surabaya'

- id: d002
  question: Ada berapa produk aktif di kategori Elektronik?
  lang: id
  category: lookup
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT count(*) AS active_products
    FROM analytics.dim_product p
    JOIN analytics.dim_category c ON c.category_id = p.category_id
    JOIN analytics.dim_category top ON top.category_id = c.parent_category_id
    WHERE p.is_active AND top.category_name = 'Electronics'

- id: d003
  question: Which payment methods have customers used?
  lang: en
  category: lookup
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT DISTINCT payment_method FROM analytics.fact_payments

- id: d004
  question: When did the Gading Serpong store open?
  lang: en
  category: lookup
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT opened_date FROM analytics.dim_store WHERE store_name ILIKE '%Gading Serpong%'

# ------------------------------------------------------------- aggregation
- id: d005
  question: How many orders have been cancelled in total?
  lang: en
  category: aggregation
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT count(*) AS cancelled_orders FROM analytics.fact_orders WHERE status = 'cancelled'

- id: d006
  question: Berapa total ongkos kirim untuk paket yang dikirim selama tahun 2025?
  lang: id
  category: aggregation
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT sum(shipping_fee_idr) AS shipping_fees_idr
    FROM analytics.fact_shipments
    WHERE (shipped_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'

- id: d007
  question: What is the average CSAT score of resolved support tickets for each ticket category?
  lang: en
  category: aggregation
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT ticket_category, round(avg(csat_score), 2) AS avg_csat
    FROM analytics.fact_support_tickets
    WHERE ticket_status = 'resolved' AND csat_score IS NOT NULL
