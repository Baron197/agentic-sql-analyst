# Test split: ONLY for reported numbers. Never use these questions or their SQL as
# few-shot examples or for prompt tuning (CLAUDE.md; enforced by the leakage-guard test).
# Gold SQL conventions are the same as in dev.yaml.

# ------------------------------------------------------------------ lookup
- id: t001
  question: How many stores are open today?
  lang: en
  category: lookup
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT count(*) AS open_stores FROM analytics.dim_store WHERE is_open

- id: t002
  question: Di berapa kota perusahaan memiliki toko?
  lang: id
  category: lookup
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT count(DISTINCT region_id) AS cities FROM analytics.dim_store

- id: t003
  question: Which store closed permanently, and on what date?
  lang: en
  category: lookup
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT store_name, closed_date FROM analytics.dim_store WHERE closed_date IS NOT NULL

- id: t004
  question: What is the list price of the most expensive active product?
  lang: en
  category: lookup
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT max(list_price_idr) AS max_list_price_idr FROM analytics.dim_product WHERE is_active

- id: t005
  question: Apa saja kode promo untuk Harbolnas 11.11?
  lang: id
  category: lookup
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT promo_code FROM analytics.dim_promotion WHERE promo_name ILIKE '%11.11%'

- id: t006
  question: How many active employees work at head office rather than in a store?
  lang: en
  category: lookup
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT count(*) AS head_office_staff FROM analytics.dim_employee WHERE store_id IS NULL AND is_active

# ------------------------------------------------------------- aggregation
- id: t007
  question: How many orders placed in 2025 were fully refunded?
  lang: en
  category: aggregation
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT count(*) AS refunded_orders
    FROM analytics.fact_orders
    WHERE status = 'refunded'
      AND (ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'

- id: t008
  question: Berapa total diskon yang diberikan pada tahun 2024, tidak termasuk pesanan yang dibatalkan?
  lang: id
  category: aggregation
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT sum(oi.discount_idr) AS total_discount_idr
    FROM analytics.fact_orders o
    JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
    WHERE o.status <> 'cancelled'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'

- id: t009
  question: For delivered parcels, what is the average number of days from shipping to delivery for each courier?
  lang: en
  category: aggregation
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT courier, round(avg(extract(epoch FROM delivered_at - shipped_at) / 86400), 2) AS avg_days
    FROM analytics.fact_shipments
    WHERE shipment_status = 'delivered'
    GROUP BY courier

- id: t010
  question: How many support tickets were opened through WhatsApp in 2026?
  lang: en
  category: aggregation
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT count(*) AS tickets
    FROM analytics.fact_support_tickets
    WHERE contact_channel = 'whatsapp'
      AND (created_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-01-01' AND DATE '2026-12-31'

- id: t011
  question: Berapa jumlah unit yang terjual per channel pada tahun 2025, tanpa pesanan yang dibatalkan?
  lang: id
  category: aggregation
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT c.channel_code, sum(oi.quantity) AS units
    FROM analytics.fact_orders o
    JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
    JOIN analytics.dim_channel c ON c.channel_id = o.channel_id
    WHERE o.status <> 'cancelled'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY c.channel_code

- id: t012
  question: How many store visitors were recorded in total during 2025?
  lang: en
  category: aggregation
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT sum(visitors) AS visitors
    FROM analytics.fact_store_daily_traffic
    WHERE traffic_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'

- id: t013
  question: How many purchase orders are still open?
  lang: en
  category: aggregation
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT count(*) AS open_purchase_orders FROM analytics.fact_purchase_orders WHERE po_status = 'open'

- id: t014
  question: What is the average CSAT score across all rated support tickets?
  lang: en
  category: aggregation
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT round(avg(csat_score), 2) AS avg_csat FROM analytics.fact_support_tickets WHERE csat_score IS NOT NULL

# -------------------------------------------------------------------- join
- id: t015
  question: Which 3 product subcategories generated the most net revenue in 2025?
  lang: en
  category: join
  difficulty: hard
  notes: line-level net revenue minus refunds of that line; subcategory = level-2 category
  gold_sql: |
    WITH line_refunds AS (
      SELECT order_item_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_item_id
    )
    SELECT c.category_name
    FROM analytics.fact_orders o
    JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
    JOIN analytics.dim_product p ON p.product_id = oi.product_id
    JOIN analytics.dim_category c ON c.category_id = p.category_id
    LEFT JOIN line_refunds lr ON lr.order_item_id = oi.order_item_id
    WHERE o.status <> 'cancelled'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY c.category_name
    ORDER BY sum(oi.quantity * oi.unit_price_idr - oi.discount_idr - coalesce(lr.refunded, 0)) DESC
    LIMIT 3
  expected: answer

- id: t016
  question: Siapa 5 pemasok dengan nilai purchase order terbesar di tahun 2025, tidak termasuk PO yang dibatalkan?
  lang: id
  category: join
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT sup.supplier_name
    FROM analytics.fact_purchase_orders po
    JOIN analytics.dim_supplier sup ON sup.supplier_id = po.supplier_id
    WHERE po.po_status <> 'cancelled'
      AND po.ordered_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY sup.supplier_name
    ORDER BY sum(po.quantity * po.unit_cost_idr) DESC
    LIMIT 5

- id: t017
  question: How many orders, excluding cancelled ones, did each store format sell in 2025?
  lang: en
  category: join
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT s.store_format, count(*) AS orders
    FROM analytics.fact_orders o
    JOIN analytics.dim_store s ON s.store_id = o.store_id
    WHERE o.status <> 'cancelled'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY s.store_format

- id: t018
  question: Customers from which city placed the most online orders in 2026?
  lang: en
  category: join
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT g.city
    FROM analytics.fact_orders o
    JOIN analytics.dim_channel ch ON ch.channel_id = o.channel_id
    JOIN analytics.dim_customer cu ON cu.customer_id = o.customer_id
    JOIN analytics.dim_region g ON g.region_id = cu.region_id
    WHERE ch.is_online
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-01-01' AND DATE '2026-12-31'
    GROUP BY g.city
    ORDER BY count(*) DESC
    LIMIT 1

- id: t019
  question: Toko mana yang paling sering kehabisan stok (stok produk 0 di akhir hari) selama September 2026?
  lang: id
  category: join
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT s.store_name
    FROM analytics.fact_inventory_daily i
    JOIN analytics.dim_store s ON s.store_id = i.store_id
    WHERE i.on_hand_qty = 0
      AND i.snapshot_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
    GROUP BY s.store_name
    ORDER BY count(*) DESC
    LIMIT 1

- id: t020
  question: Which sales associate (by employee code) served the most completed in-store orders in 2025?
  lang: en
  category: join
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT e.employee_code
    FROM analytics.fact_orders o
    JOIN analytics.dim_employee e ON e.employee_id = o.sales_employee_id
    WHERE o.status = 'completed'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY e.employee_code
    ORDER BY count(*) DESC
    LIMIT 1

- id: t021
  question: How many registered customers live in each region group?
  lang: en
  category: join
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT g.region_group, count(*) AS customers
    FROM analytics.dim_customer c
    JOIN analytics.dim_region g ON g.region_id = c.region_id
    GROUP BY g.region_group

- id: t022
  question: Which promotion was redeemed the most times, and how many redemptions did it have?
  lang: en
  category: join
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT p.promo_name, count(*) AS redemptions
    FROM analytics.fact_promotion_redemptions r
    JOIN analytics.dim_promotion p ON p.promotion_id = r.promotion_id
    GROUP BY p.promo_name
    ORDER BY count(*) DESC
    LIMIT 1

# -------------------------------------------------------------------- time
- id: t023
  question: How many orders were placed during the Lebaran week of 2025, from 31 March to 6 April?
  lang: en
  category: time
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT count(*) AS orders
    FROM analytics.fact_orders
    WHERE (ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-03-31' AND DATE '2025-04-06'

- id: t024
  question: Berapa jumlah pesanan pada tanggal 12 Desember 2024?
  lang: id
  category: time
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT count(*) AS orders
    FROM analytics.fact_orders
    WHERE (ordered_at AT TIME ZONE 'Asia/Jakarta')::date = DATE '2024-12-12'

- id: t025
  question: By how much did the number of orders change from August 2026 to September 2026?
  lang: en
  category: time
  difficulty: medium
  notes: September count minus August count
  expected: answer
  gold_sql: |
    SELECT count(*) FILTER (WHERE (ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30')
         - count(*) FILTER (WHERE (ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31')
           AS change_in_orders
    FROM analytics.fact_orders

- id: t026
  question: How many orders in 2025 were placed between midnight and 6 a.m. Jakarta time?
  lang: en
  category: time
  difficulty: hard
  expected: answer
  gold_sql: |
    SELECT count(*) AS orders
    FROM analytics.fact_orders
    WHERE extract(hour FROM ordered_at AT TIME ZONE 'Asia/Jakarta') < 6
      AND (ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'

- id: t027
  question: Berapa total pengunjung toko pada akhir pekan di bulan Juli 2026?
  lang: id
  category: time
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT sum(t.visitors) AS weekend_visitors
    FROM analytics.fact_store_daily_traffic t
    JOIN analytics.dim_date d ON d.date_key = t.traffic_date
    WHERE d.is_weekend AND d.year = 2026 AND d.month = 7

- id: t028
  question: What was net revenue in calendar Q1 2026, and in fiscal Q1 of FY2026?
  lang: en
  category: time
  difficulty: hard
  notes: calendar Q1 2026 = Jan-Mar 2026; fiscal Q1 FY2026 = Apr-Jun 2026
  expected: answer
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date AS order_date,
             sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
      GROUP BY o.order_id, o.ordered_at
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    ),
    net AS (
      SELECT n.order_date, n.line_net - coalesce(r.refunded, 0) AS net
      FROM order_net n LEFT JOIN refunds r ON r.order_id = n.order_id
    )
    SELECT sum(net) FILTER (WHERE order_date BETWEEN DATE '2026-01-01' AND DATE '2026-03-31') AS calendar_q1_2026_idr,
           sum(net) FILTER (WHERE order_date BETWEEN DATE '2026-04-01' AND DATE '2026-06-30') AS fiscal_q1_fy2026_idr
    FROM net

- id: t029
  question: How many new customers signed up in each calendar quarter of 2025?
  lang: en
  category: time
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT extract(quarter FROM signup_date) AS quarter, count(*) AS new_customers
    FROM analytics.dim_customer
    WHERE signup_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY 1

- id: t030
  question: On which date in 2025 did the company receive the most orders?
  lang: en
  category: time
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT (ordered_at AT TIME ZONE 'Asia/Jakarta')::date AS order_date
    FROM analytics.fact_orders
    WHERE (ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY 1
    ORDER BY count(*) DESC
    LIMIT 1

# ------------------------------------------------------- metric definition
- id: t031
  question: What was total net revenue in FY2025?
  lang: en
  category: metric_definition
  difficulty: medium
  expected: answer
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-04-01' AND DATE '2026-03-31'
      GROUP BY o.order_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT sum(n.line_net - coalesce(r.refunded, 0)) AS net_revenue_idr
    FROM order_net n LEFT JOIN refunds r ON r.order_id = n.order_id

- id: t032
  question: Berapa gross sales selama tahun kalender 2025?
  lang: id
  category: metric_definition
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT sum(oi.quantity * oi.unit_price_idr) AS gross_sales_idr
    FROM analytics.fact_orders o
    JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
    WHERE o.status <> 'cancelled'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'

- id: t033
  question: What was the average order value of app orders in 2026?
  lang: en
  category: metric_definition
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT round(sum(o.total_amount)::numeric / count(*)) AS aov_idr
    FROM analytics.fact_orders o
    JOIN analytics.dim_channel c ON c.channel_id = o.channel_id
    WHERE o.status <> 'cancelled' AND c.channel_code = 'app'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-01-01' AND DATE '2026-12-31'

- id: t034
  question: Berapa tingkat konversi sesi di aplikasi (app) selama tahun 2025?
  lang: id
  category: metric_definition
  difficulty: medium
  expected: answer
  gold_sql: |
    SELECT round(avg(s.converted::int), 4) AS conversion_rate
    FROM analytics.fact_web_sessions s
    JOIN analytics.dim_channel c ON c.channel_id = s.channel_id
    WHERE c.channel_code = 'app'
      AND (s.started_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'

- id: t035
  question: What was the return rate of each channel for orders placed in 2025?
  lang: en
  category: metric_definition
  difficulty: hard
  expected: answer
  gold_sql: |
    SELECT c.channel_code,
           round(sum(coalesce(r.qty, 0))::numeric / sum(oi.quantity), 4) AS return_rate
    FROM analytics.fact_orders o
    JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
    JOIN analytics.dim_channel c ON c.channel_id = o.channel_id
    LEFT JOIN (
      SELECT order_item_id, sum(quantity) AS qty FROM analytics.fact_returns GROUP BY order_item_id
    ) r ON r.order_item_id = oi.order_item_id
    WHERE o.status <> 'cancelled'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY c.channel_code

- id: t036
  question: How many active customers did we have as of 30 June 2026?
  lang: en
  category: metric_definition
  difficulty: hard
  expected: answer
  gold_sql: |
    SELECT count(DISTINCT customer_id) AS active_customers
    FROM analytics.fact_orders
    WHERE status = 'completed' AND customer_id IS NOT NULL
      AND (ordered_at AT TIME ZONE 'Asia/Jakarta')::date > DATE '2026-06-30' - 90
      AND (ordered_at AT TIME ZONE 'Asia/Jakarta')::date <= DATE '2026-06-30'

- id: t037
  question: Berapa pendapatan bersih per region group pada FY2025?
  lang: id
  category: metric_definition
  difficulty: hard
  expected: answer
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, o.store_id, sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-04-01' AND DATE '2026-03-31'
      GROUP BY o.order_id, o.store_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT g.region_group, sum(n.line_net - coalesce(r.refunded, 0)) AS net_revenue_idr
    FROM order_net n
    JOIN analytics.dim_store s ON s.store_id = n.store_id
    JOIN analytics.dim_region g ON g.region_id = s.region_id
    LEFT JOIN refunds r ON r.order_id = n.order_id
    GROUP BY g.region_group

- id: t038
  question: Which store had the highest net revenue in September 2026?
  lang: en
  category: metric_definition
  difficulty: medium
  expected: answer
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, o.store_id, sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
      GROUP BY o.order_id, o.store_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT s.store_name
    FROM order_net n
    JOIN analytics.dim_store s ON s.store_id = n.store_id
    LEFT JOIN refunds r ON r.order_id = n.order_id
    GROUP BY s.store_name
    ORDER BY sum(n.line_net - coalesce(r.refunded, 0)) DESC
    LIMIT 1

- id: t039
  question: What percentage of orders placed in 2025 were cancelled?
  lang: en
  category: metric_definition
  difficulty: easy
  expected: answer
  gold_sql: |
    SELECT round(100.0 * count(*) FILTER (WHERE status = 'cancelled') / count(*), 2) AS cancelled_pct
    FROM analytics.fact_orders
    WHERE (ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'

- id: t040
  question: Which stores missed their net revenue target in August 2026?
  lang: en
  category: metric_definition
  difficulty: hard
  notes: store net revenue (all channels it fulfilled) compared with fact_sales_targets for 2026-08
  expected: answer
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, o.store_id, sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31'
      GROUP BY o.order_id, o.store_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    ),
    store_net AS (
      SELECT n.store_id, sum(n.line_net - coalesce(r.refunded, 0)) AS net
      FROM order_net n LEFT JOIN refunds r ON r.order_id = n.order_id
      GROUP BY n.store_id
    )
    SELECT s.store_name
    FROM analytics.fact_sales_targets t
    JOIN analytics.dim_store s ON s.store_id = t.store_id
    LEFT JOIN store_net sn ON sn.store_id = t.store_id
    WHERE t.month_start = DATE '2026-08-01'
      AND coalesce(sn.net, 0) < t.target_net_revenue_idr

# --------------------------------------------------------------- ambiguous
- id: t041
  question: What were our sales last year?
  lang: en
  category: ambiguous
  difficulty: medium
  expected: state_assumption
  notes: default = net revenue for calendar year 2025 (state calendar vs fiscal year)
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
      GROUP BY o.order_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT sum(n.line_net - coalesce(r.refunded, 0)) AS net_revenue_idr
    FROM order_net n LEFT JOIN refunds r ON r.order_id = n.order_id

- id: t042
  question: Produk apa yang paling laris?
  lang: id
  category: ambiguous
  difficulty: medium
  expected: state_assumption
  notes: default = the product with the most units sold (non-cancelled) over all available data
  gold_sql: |
    SELECT p.product_name
    FROM analytics.fact_orders o
    JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
    JOIN analytics.dim_product p ON p.product_id = oi.product_id
    WHERE o.status <> 'cancelled'
    GROUP BY p.product_name
    ORDER BY sum(oi.quantity) DESC
    LIMIT 1

- id: t043
  question: How are online sales doing compared with stores this year?
  lang: en
  category: ambiguous
  difficulty: hard
  expected: state_assumption
  notes: default = net revenue in 2026 to date (Jan-Sep), online channels vs physical stores
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, o.channel_id, sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
        AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-01-01' AND DATE '2026-09-30'
      GROUP BY o.order_id, o.channel_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT c.is_online, sum(n.line_net - coalesce(r.refunded, 0)) AS net_revenue_idr
    FROM order_net n
    JOIN analytics.dim_channel c ON c.channel_id = n.channel_id
    LEFT JOIN refunds r ON r.order_id = n.order_id
    GROUP BY c.is_online

- id: t044
  question: Which region performs best?
  lang: en
  category: ambiguous
  difficulty: medium
  expected: state_assumption
  notes: default = region group with the highest net revenue over all available data
  gold_sql: |
    WITH order_net AS (
      SELECT o.order_id, o.store_id, sum(oi.quantity * oi.unit_price_idr - oi.discount_idr) AS line_net
      FROM analytics.fact_orders o
      JOIN analytics.fact_order_items oi ON oi.order_id = o.order_id
      WHERE o.status <> 'cancelled'
      GROUP BY o.order_id, o.store_id
    ),
    refunds AS (
      SELECT order_id, sum(refund_amount_idr) AS refunded FROM analytics.fact_returns GROUP BY order_id
    )
    SELECT g.region_group
    FROM order_net n
    JOIN analytics.dim_store s ON s.store_id = n.store_id
    JOIN analytics.dim_region g ON g.region_id = s.region_id
    LEFT JOIN refunds r ON r.order_id = n.order_id
    GROUP BY g.region_group
    ORDER BY sum(n.line_net - coalesce(r.refunded, 0)) DESC
    LIMIT 1

- id: t045
  question: Berapa rata-rata belanja pelanggan?
  lang: id
  category: ambiguous
  difficulty: medium
  expected: state_assumption
  notes: default = average order value (AOV) over all available data; alternative = spend per customer
  gold_sql: |
    SELECT round(sum(total_amount)::numeric / count(*)) AS aov_idr
    FROM analytics.fact_orders
    WHERE status <> 'cancelled'

