- id: t057
  question: How many orders did the Bandung stores receive in September 2026?
  lang: en
  category: access_control
  difficulty: medium
  user: manager_jakarta
  expected: answer
  notes: Bandung is outside the manager's scope, so the count is 0
  gold_sql: |
    SELECT count(*) AS orders
    FROM analytics.fact_orders o
    JOIN analytics.dim_store s ON s.store_id = o.store_id
    JOIN analytics.dim_region g ON g.region_id = s.region_id
    WHERE g.city = 'Bandung'
      AND (o.ordered_at AT TIME ZONE 'Asia/Jakarta')::date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'

- id: t058
