[project]
name = "sql-analyst"
version = "0.1.0"
description = "An agentic natural-language-to-SQL analyst over a fictional retailer's database: every answer shows its SQL, its rows, and numbers filled in by code."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Baron Purwa Hartono", email = "Baron197@users.noreply.github.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "faker>=37",
    "pyyaml>=6.0",
    "sqlglot>=30.25",
    "psycopg-pool>=3.3",
    "anthropic>=1.0",
    "openai>=1.60",
    "langgraph>=1.2.18",
    "fastembed>=0.9.1",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "argon2-cffi>=25.1",
    "pyjwt>=2.15",
]

[project.scripts]
sql-analyst = "sql_analyst.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "poethepoet>=0.31",
    "check-jsonschema>=0.30",
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend/src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job; long string literals are fine

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["db: needs the Postgres container (skipped locally if it is down; required in CI)"]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
lint-ci = "check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/ci.yml"
test = "pytest"
check = ["lint", "format-check", "lint-ci", "test"]

db-up = "docker compose up -d --wait db"
db-down = "docker compose down"
db-ping = "python -m sql_analyst.db.ping"
db-checksum = "python -m sql_analyst.db.checksum"

[tool.poe.tasks.db-load]
help = "Rebuild the core + analytics schemas and load the deterministic seed (any database)"
cmd = "python -m sql_analyst.db.load"

[tool.poe.tasks.db-reset]
help = "Start the local container if needed, rebuild schemas and seed, build the retrieval index, set up the API schema"
sequence = ["db-up", "db-load", "index-build", "app-setup"]

[tool.poe.tasks.app-setup]
help = "Create the API's app schema and write-only role, and seed the demo users (keeps stored runs)"
cmd = "python -m sql_analyst.db.app_setup"

[tool.poe.tasks.api]
help = "Run the API on http://127.0.0.1:8000 (docs at /api/docs); keyless unless LLM_PROVIDER and LIVE_MODE_ENABLED say otherwise"
cmd = "uvicorn sql_analyst.api.main:create_app --factory --host 127.0.0.1 --port 8000"
env = { HF_HUB_DISABLE_SYMLINKS_WARNING = "1" }

[tool.poe.tasks.index-build]
help = "Embed the dictionary, glossary, and examples into pgvector (retrieval schema); run after db-load"
cmd = "python -m sql_analyst.retrieval.index"
env = { HF_HUB_DISABLE_SYMLINKS_WARNING = "1" }

[tool.poe.tasks.db-wipe]
help = "Stop the container and delete its volume (all local database data)"
cmd = "docker compose down -v"

[tool.poe.tasks.ask]
help = "Ask the agent a question: keyless by default (--mode live --model M for a paid model)"
cmd = "sql-analyst ask"
env = { HF_HUB_DISABLE_SYMLINKS_WARNING = "1" }

[tool.poe.tasks.web-install]
help = "Install the web app's packages from package-lock.json (npm ci)"
shell = "npm --prefix web ci"

[tool.poe.tasks.web]
help = "Run the web app on http://127.0.0.1:5173 (proxies /api to `poe api`)"
shell = "npm --prefix web run dev"

[tool.poe.tasks.web-check]
help = "Web app: lint, format check, typecheck, unit tests, build"
shell = "npm --prefix web run check"

[tool.poe.tasks.web-e2e]
help = "Playwright smoke test (starts `poe api` and the web dev server if they aren't running)"
shell = "npm --prefix web run e2e"

[tool.poe.tasks.web-screenshots]
help = "Screenshots of the sign-in and Ask pages at 375 px and 1280 px into docs/screenshots/"
shell = "npm --prefix web run screenshots"

[tool.poe.tasks.recorded-dump]
help = "Print the live runs in the run store as JSON (--since YYYY-MM-DD); redirect to a file for recorded-add"
cmd = "python -m sql_analyst.recorded dump"

[tool.poe.tasks.recorded-add]
help = "Publish runs from a dump: recorded-add FILE [--ids ID,ID] (writes data/recorded_runs.json and docs/RECORDED_RUNS.md)"
cmd = "python -m sql_analyst.recorded add"

[tool.poe.tasks.recorded-docs]
help = "Regenerate docs/RECORDED_RUNS.md from data/recorded_runs.json"
cmd = "python -m sql_analyst.recorded docs"

[tool.poe.tasks.smoke-public]
help = "Smoke-test a deployed stack: --url https://HOST [--ask] [--expect-status 429|503] (--ask is paid in live mode)"
cmd = "python infra/smoke_public.py"

[tool.poe.tasks.eval]
help = "Run the evaluation harness: --system gold|baseline --mode keyless|live --split dev|test (see eval/run_eval.py)"
cmd = "python -m eval.run_eval"
